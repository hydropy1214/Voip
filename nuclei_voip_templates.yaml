id: voip-default-credentials
name: VoIP Device Default Credentials
author: VoIP Security Team
severity: critical
description: |
  Detects VoIP devices and systems accepting default credentials including:
  - admin:admin
  - admin:password
  - admin:123456
  - root:root
  - Allows unauthorized administrative access and configuration changes

tags:
  - voip
  - default-credentials
  - authentication
  - misconfiguration

http:
  - raw:
      - |
        GET /admin/ HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic YWRtaW46YWRtaW4=
        User-Agent: Mozilla/5.0
        Connection: close
        
      - |
        GET /admin/ HTTP/1.1
        Host: {{Hostname}}
        Authorization: Basic YWRtaW46cGFzc3dvcmQ=
        User-Agent: Mozilla/5.0
        Connection: close

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          
      - type: word
        part: body
        words:
          - "dashboard"
          - "configuration"
          - "admin"
          - "settings"
        condition: or

