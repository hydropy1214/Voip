id: rtcp-bleed-disclosure
name: RTP/RTCP Information Disclosure (RTP Bleed)
author: VoIP Security Team
severity: high
description: |
  Detects systems vulnerable to RTCP information disclosure which can reveal:
  - Active call information
  - Media stream parameters
  - Network topology details
  - Call timing information

tags:
  - voip
  - rtp
  - rtcp
  - information-disclosure

network:
  - type: raw
    host:
      - "{{Hostname}}"
    port: 16384-32767
    
    data: |
      RTCP Packet Probe (raw UDP with RTCP header)
      
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "RTCP"
          - "SDES"
          - "Sender Report"

---
id: voip-call-interception
name: Potential Call Interception Vulnerability
author: VoIP Security Team
severity: critical
description: |
  Detects VoIP systems without proper media encryption (SRTP) that could be
  vulnerable to real-time call recording and interception attacks.

tags:
  - voip
  - encryption
  - media-security
  - srtp

network:
  - type: raw
    host:
      - "{{Hostname}}"
    port: 5060
    
    data: |
      INVITE sip:test@{{Hostname}} SIP/2.0
      Via: SIP/2.0/UDP attacker:5060;branch=z9hG4bK776asdhds
      To: <sip:test@{{Hostname}}>
      From: <sip:attacker@attacker>;tag=1928301774
      Call-ID: crypto@attacker.invalid
      CSeq: 1 INVITE
      Contact: <sip:attacker@attacker:5060>
      Content-Type: application/sdp
      Content-Length: 150
      
      v=0
      o=attacker 0 0 IN IP4 attacker
      s=-
      c=IN IP4 attacker
      t=0 0
      m=audio 16384 RTP/AVP 0
      
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'm=audio.*RTP/AVP'
          - 'a=rtpmap.*PCMU'
        negative: true
        
      - type: word
        part: body
        words:
          - "a=crypto"
          - "a=fingerprint"
        condition: or
        negative: true
