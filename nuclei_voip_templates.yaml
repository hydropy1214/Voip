id: freepbx-admin-exposure
name: FreePBX Administrative Interface - CVE-2019-11334
author: VoIP Security Team
severity: critical
description: |
  Detects exposed FreePBX administrative interfaces vulnerable to remote code execution.
  CVE-2019-11334 allows authenticated and unauthenticated attackers to execute arbitrary
  code via the Bulk User Management feature. Affected: FreePBX < 14.0.3.18 and 15.x < 15.0.9

reference:
  - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2019-11334
  - https://www.freepbx.org/

tags:
  - voip
  - freepbx
  - cve
  - rce
  - pbx

http:
  - raw:
      - |
        GET /admin/modules.php?display=bulkhandler HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0
        Accept: text/html
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "FreePBX"
          - "Bulk Handler"
          - "bulkhandler"
        condition: or
        
      - type: status
        status:
          - 200

