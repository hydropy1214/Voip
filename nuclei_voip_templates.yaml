id: asterisk-manager-exposure
name: Asterisk Manager Interface Exposure
author: VoIP Security Team
severity: critical
description: |
  Detects exposed Asterisk Manager Interface (AMI) on port 5038 without authentication.
  AMI provides full system control including call management, channel manipulation,
  dialplan reloads, and configuration changes.

tags:
  - voip
  - asterisk
  - management
  - exposure
  - rce

network:
  - type: raw
    host:
      - "{{Hostname}}"
    port: 5038
    
    data: |
      Action: Ping
      ActionID: 1
      
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "Pong"
          - "Event: Ping"
          - "Asterisk"
        condition: or

