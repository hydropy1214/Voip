id: voipmonitor-cve-2021-30461
name: VoIPmonitor Administrative Panel - CVE-2021-30461 Detection
author: VoIP Security Team
severity: critical
description: |
  Detects exposed VoIPmonitor administrative panels vulnerable to CVE-2021-30461.
  This vulnerability affects VoIPmonitor versions < v24.61 and allows:
  - Authentication bypass
  - Remote code execution via administrative interface
  - Unauthorized access to call records and configuration
  - Potential lateral movement in VoIP infrastructure

reference:
  - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2021-30461
  - https://www.voipmonitor.org/

tags:
  - voip
  - sip
  - cve
  - voipmonitor
  - authentication
  - rce

http:
  - raw:
      - |
        GET /index.php HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0
        Accept: text/html,application/xhtml+xml
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "VoIPmonitor"
          - "SIP monitoring"
          - "Call recording"
        condition: or
        
      - type: regex
        part: body
        regex:
          - 'version["\s:=]*([0-9]+\.[0-9]+)'
          - 'voipmonitor["\s]*version["\s:=]*([0-9.]+)'
        capture: true
        
      - type: status
        status:
          - 200

