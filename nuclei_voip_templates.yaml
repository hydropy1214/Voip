id: sip-options-flood-dos
name: SIP OPTIONS Flooding DoS Vector
author: VoIP Security Team
severity: high
description: |
  Identifies SIP servers vulnerable to DoS via OPTIONS request flooding.
  Systems without rate limiting can be crashed or made unavailable.
  Related to CVE-2020-9496 (Asterisk PJSIP Remote Crash).

tags:
  - voip
  - sip
  - dos
  - denial-of-service

network:
  - type: raw
    host:
      - "{{Hostname}}"
    port: 5060
    
    data: |
      OPTIONS sip:{{Hostname}}:5060 SIP/2.0
      Via: SIP/2.0/UDP scanner:5060;branch=z9hG4bK776asdhds
      To: <sip:{{Hostname}}:5060>
      From: <sip:scanner@scanner>;tag=1928301774
      Call-ID: dos@scanner.invalid
      CSeq: 1 OPTIONS
      User-Agent: Nuclei
      Max-Forwards: 0
      Contact: <sip:scanner@scanner>
      
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "483 Too Many Hops"
          - "500 Server Internal Error"

