id: asterisk-sip-options-fingerprint
name: Asterisk SIP Version Information Disclosure
author: VoIP Security Team
severity: high
description: |
  Detects Asterisk SIP servers exposing version information via OPTIONS responses.
  This vulnerability (CVE-2020-12701) allows attackers to identify vulnerable versions
  and plan targeted attacks. Asterisk versions < 16.16.0, 17.x < 17.9.1, 18.x < 18.1.1
  are vulnerable to information disclosure.

reference:
  - https://downloads.asterisk.org/pub/security/AST-2020-001.pdf
  - https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2020-12701

tags:
  - voip
  - sip
  - asterisk
  - cve
  - information-disclosure
  - banner-grabbing

network:
  - type: raw
    host:
      - "{{Hostname}}"
    port: 5060
    
    data: |
      OPTIONS sip:{{Hostname}}:5060 SIP/2.0
      Via: SIP/2.0/UDP scanner:5060;branch=z9hG4bK776asdhds
      To: <sip:{{Hostname}}:5060>
      From: <sip:scanner@scanner>;tag=1928301774
      Call-ID: scanner@scanner.invalid
      CSeq: 314159 OPTIONS
      User-Agent: Nuclei Scanner
      Accept: application/sdp
      Contact: <sip:scanner@scanner>
      
    matchers-condition: and
    matchers:
      - type: regex
        part: body
        regex:
          - 'Asterisk\s+([0-9.]+)'
          - 'Server:\s+.*Asterisk.*([0-9.]+)'
        capture: true
        
      - type: word
        part: body
        words:
          - "Asterisk"
          - "Allow: INVITE, ACK, CANCEL, BYE, NOTIFY, REFER, MESSAGE, OPTIONS, INFO"
        condition: or

