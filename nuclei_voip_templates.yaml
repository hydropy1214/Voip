id: anonymous-sip-registration
name: Anonymous SIP Registration Allowed
author: VoIP Security Team
severity: critical
description: |
  Detects SIP servers that allow anonymous user registration without authentication.
  This misconfiguration enables unauthorized call routing, toll fraud, and system abuse.
  An attacker can register as any user and make outbound calls at the owner's expense.

tags:
  - voip
  - sip
  - misconfiguration
  - authentication
  - fraud

network:
  - type: raw
    host:
      - "{{Hostname}}"
    port: 5060
    
    data: |
      REGISTER sip:{{Hostname}}:5060 SIP/2.0
      Via: SIP/2.0/UDP attacker:5060;branch=z9hG4bK776asdhds
      To: <sip:anonymous@{{Hostname}}>
      From: <sip:anonymous@attacker>;tag=1928301774
      Call-ID: anonreg@attacker.invalid
      CSeq: 1 REGISTER
      Contact: <sip:anonymous@attacker:5060>
      User-Agent: Nuclei
      Max-Forwards: 70
      
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "200 OK"
          - "100 Trying"
        condition: or
        
      - type: regex
        part: body
        regex:
          - 'Contact:\s+<sip:anonymous'

