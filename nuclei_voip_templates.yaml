id: sip-header-injection
name: SIP Header Injection Vulnerability
author: VoIP Security Team
severity: high
description: |
  Tests for SIP header injection vulnerabilities that could lead to:
  - Call rerouting
  - Denial of service
  - Information disclosure
  - Authentication bypass via header manipulation

tags:
  - voip
  - sip
  - injection
  - cwe-94

network:
  - type: raw
    host:
      - "{{Hostname}}"
    port: 5060
    
    data: |
      INVITE sip:{{Hostname}}:5060 SIP/2.0
      Via: SIP/2.0/UDP attacker:5060;branch=z9hG4bK776asdhds
      To: <sip:test@{{Hostname}}>
      From: <sip:attacker@attacker>;tag=1928301774
      Call-ID: injection@attacker.invalid
      CSeq: 1 INVITE
      Contact: <sip:attacker@attacker:5060>
      User-Agent: test"; DROP TABLE users; --
      Max-Forwards: 70
      
    matchers-condition: or
    matchers:
      - type: word
        part: body
        words:
          - "500 Server Internal Error"
          - "400 Bad Request"
        condition: or
        negative: true

